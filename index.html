<h1>معراج پیامبر (ص) — خلاصه و آزمون</h1>
<p style="color:var(--m)"></p>

<script>
const S=[["۱. هدف کتاب و زبان آن","نویسنده می‌گوید فهم مسئله‌ی معراج به علوم فراوانی نیاز دارد و عمداً به زبان عامیانه می‌نویسد تا همه بتوانند بخوانند."],["۲. اجماع مسلمین","آنچه مسلمانان بر آن اجماع دارند همان قول پیامبر است و باید با این میزان سنجیده شود."],["۳. پیامبر اولین مخلوق","پیامبر (ص) «اول ما خلق الله» و اسم اعظم است و جسد اصیل و نور او مبنای آفرینش دانسته شده است."],["۴. قانون طبیعی لطافت و کثافت","هر چیز به طبع خود در جای خود می‌ایستد؛ سنگین پایین و لطیف بالاتر است. لطیف مانع کثیف نیست."],["۵. بدن پیامبر و چرایی جسمانی‌بودن معراج","بدن پیامبر هفتاد مرتبه لطیف‌تر از عرش است و نویسنده معراج را با جسد سماوی لطیف توضیح می‌دهد."],["۶. بدن اصیل و اعراض","بدن اصیل ثابت است و اعراضی مانند چاقی و لاغری می‌آیند و می‌روند."],["۷. قاب قوسین و مقام فؤاد","قاب مقدار و قوسین دو کمان است؛ فؤاد پایان سیر هر مخلوق و آیت و نور خداست، نه ذات او."],["۸. عرش، کرسی و سدرةالمنتها","عرش مقام وحدت و کرسی مقام نفس و ولایت است؛ اصل سدره در کرسی و ظهورش در آسمان هفتم است."],["۹. فرشتگان، براق و صورت جبرئیل","ترتیب خلقت فرشتگان میکائیل، اسرافیل، عزرائیل، جبرئیل است و براق ظهور روح دانسته شده است."],["۱۰. مراتب انسان و تکامل روح","غذا به خون و بخار لطیف تبدیل می‌شود و با عمل شایسته روح لطیف می‌شود تا قلب انسانی حاصل شود."],["۱۱. معجزه و اسباب","خرق عادت یعنی کوتاه‌کردن اسباب عادی نه نفی سبب؛ معجزه امر ممکن خارق عادت است."]];
const M=`مرتبه‌ی لطافت بدن پیامبر نسبت به عرش چه‌قدر است؟|هفتاد مرتبه لطیف‌تر|هم‌سطح|هفتاد مرتبه کثیف‌تر|دو برابر لطیف‌تر
عرش و کرسی از نظر مقام چگونه‌اند؟|عرش مقام وحدت، کرسی مقام کثرت|برعکس|هر دو وحدت|هر دو کثرت
صفرا و سودا به کجا می‌روند؟|صفرا به مراره، سودا به طحال|صفرا به طحال، سودا به مراره|هر دو به کبد|هر دو به مثانه
کدام معنا برای «قاب قوسین» در کتاب نیامده؟|دو شمشیر|دو کمان عقل تا خاک|خودبینی تا خدابینی|دو کمان خلق و حق

«ما کذب الفؤاد» نشانه‌ی چیست؟|دیدن با دیده‌ی دل نه چشم|دیدن با چشم|خواب|تخیل
مثال سوراخ سوزن در کتاب برای چیست؟|دقت و وحدت مقام و پوشیدگی چشم|اندازه‌ی براق|حجم جبرئیل|فاصله‌ی آسمان‌ها
نمونه‌ی نادانی امت‌ها با وجود معجزه چیست؟|گوساله‌پرستی بنی‌اسرائیل|قوم نوح|قوم عاد|قوم ثمود
دلیل حجت‌بودن اجماع چیست؟|قول پیامبر و کمال دین|رأی اکثریت|فقط عقل|عادت
معراج به نظر نویسنده با چه بدنی بود؟|جسد سماوی لطیف|روح بدون بدن|جسد عنصری سنگین|رؤیا
مثال خیال در خانه چه را می‌رساند؟|لطیف مانع کثیف ندارد|دیوار شکافت|خانه بزرگ بود|در باز بود

صورت دحیه برای جبرئیل چه بود؟|عرض و دخیل به ذات نیست|ذات اصلی|بدن اصیل|بال
علی (ع) در معراج در کدام سمت دیده شد و مقام چه بود؟|سمت چپ؛ جانب نفس|سمت راست؛ عقل|پشت؛ فؤاد|بالا؛ عرش
بدن اصیل و عرض کدام درست است؟|اصیل ثابت، چاقی و لاغری عرض|هر دو ثابت|هر دو متغیر|برعکس
نزول اخری در سدره چند بار و کجا بود؟|دو بار: عرش و کرسی|یک بار عرش|سه بار|فقط کرسی
نور احدیت و واحدیت در کدام ظاهر شد؟|احدیت در عرش، واحدیت در کرسی|برعکس|هر دو عرش|هر دو کرسی
ترتیب فرشته‌ها چیست؟|میکائیل، اسرافیل، عزرائیل، جبرئیل|جبرئیل اول|عزرائیل اول|اسرافیل اول
«فؤاد» کدام است؟|آیت و نور خدا و پایان سیر|ذات خدا|عقل|نفس
معجزه برای صاحبش چیست؟|اسباب خاصه در تصرف اوست|بدون سبب|سحر|تصادف
جبرئیل صورت اصلی‌اش را کجا نشان داد؟|عرفات|مدینه|کعبه|غار حرا
قلب مؤمن نتیجه‌ی لطافت تا کدام مرتبه است؟|فلک تا عرش|خاک|ماده|حس`;
const T=`بدن پیامبر هفتاد مرتبه از عرش لطیف‌تر است.|1
در عرش نور واحدیت و در کرسی نور احدیت دیده شد.|0
عرش مقام وحدت و کرسی مقام کثرت است.|1
نویسنده برای اثبات ادعاها هیچ مثالی نمی‌آورد.|0
صفرا به طحال و سودا به مراره می‌رود.|0
فلک منازل زیر کرسی حد جبرئیل بود.|1
وجود سبب مخفی معجزه را باطل می‌کند.|0
سایه‌نداشتن پیامبر از کثافت بدن او بود.|0
آتش طبعاً بالا می‌رود.|1
خاک سبک‌ترین عنصر است.|0
آسمان دوم از آسمان اول لطیف‌تر است.|1
عرش از کرسی کثیف‌تر است.|0
فؤاد پایان سیر مخلوق و آیت خداست.|1
جبرئیل و پیامبر هر دو از سدره گذشتند.|0
بنی‌اسرائیل پس از معجزات موسی گوساله پرستیدند.|1
خیال انسان با دیوار مانع می‌شود.|0
قاب قوسین به خودبینی و خدابینی هم تفسیر شده است.|1
صورت دحیه ذات اصیل جبرئیل بود.|0
صورت دحیه عرض و دخیل به ذات نبود.|1
اعراض جزو بدن اصیل‌اند.|0
لطیف مانع کثیف نمی‌شود.|1
نویسنده می‌گوید خدا فوق است مثل بالابودن آسمان.|0
سوراخ سوزن مثال دقت مقام است.|1
دو نزول در سدره یکی در عرش و یکی در کرسی بود.|1
«بنده خدا می‌شود» از نظر نویسنده درست است.|0`;
const B=`اولین مخلوق خدا ____ است.|پیامبر (ص)
«قاب قوسین» یعنی مقدار ____.|دو کمان
سدرةالمنتها حد ____ بود.|جبرئیل
«قلب المؤمن عرش ____».|الرحمن
بدن پیامبر ____ نداشت.|سایه
پایان سیر مخلوق مقام ____ است.|فؤاد
براق ظهور ____ بود.|روح
معجزه امر ____ خارق عادت است.|ممکن
بدن پیامبر ____ مرتبه از عرش لطیف‌تر است.|هفتاد
اصل سدره در ____ است.|کرسی
ظهور سدره در آسمان ____ است.|هفتم
صفرا به ____ می‌رود.|مراره
سودا به ____ می‌رود.|طحال
عرش مقام ____ و کرسی مقام کثرت است.|وحدت
در عرش نور ____ دیده شد.|احدیت
در کرسی نور ____ دیده شد.|واحدیت
رنگ جامه مثال ____ است.|عرض
صورت ____ برای جبرئیل عرض بود.|دحیه
علی (ع) در جانب ____ دیده شد.|یسار
اهل ____ از شکل بدن به روح حکم می‌کنند.|قیافه
جبرئیل صورت اصلی را در ____ نشان داد.|عرفات
جبرئیل خادم پیامبر و ____ است.|شیعیان
«ما کذب الفؤاد» یعنی با دیده‌ی ____ دید.|دل
خاک سنگین است و در ____ می‌ایستد.|پایین
فرشتگان: میکائیل، ____، عزرائیل، جبرئیل.|اسرافیل`;
const Q=`چرا نویسنده کتاب را عامیانه نوشت؟|تا عموم بفهمند و آن را ذخیره‌ی آخرت می‌داند.
چه علومی برای فهم معراج لازم است؟|هندسه، هیئت، جغرافیا، مناظر و مرایا، طبیعیات، جفر، کیمیا و...
اجماع چرا حجت است؟|چون دین کامل شده و اجماع مسلمین قول پیامبر است.
قانون جای هر چیز چیست؟|هر چیز به طبع در جای خود می‌ایستد؛ سنگین پایین، سبک بالا.
چرا لطیف مانع کثیف نمی‌شود؟|چون لطیف نافذ است؛ مثل آتش در سنگ یا خیال از دیوار.
چرا بدن پیامبر سایه نداشت؟|چون هفتاد مرتبه از عرش لطیف‌تر بود.
چرا فلک شکافته نشد؟|بدن لطیف از میان آن می‌گذرد و نیازی به شکافتن نیست.
معراج به چه بدنی بود؟|جسد سماوی لطیف نه عنصری سنگین.
معجزه چیست و مثالش؟|ممکنِ خارق عادت؛ مثل صنعتگر که کار سال‌ها را در ساعتی می‌کند.
بدن اصیل با عرض چه فرقی دارد؟|اصیل ثابت؛ چاقی و لاغری مثل رنگ جامه می‌آیند و می‌روند.
معانی «قاب قوسین» را بگو.|دو کمان عقل تا خاک، خودبینی تا خدابینی، خلق و حق.
مقام فؤاد چیست؟|آیت و نور خدا و پایان سیر هر مخلوق، نه ذات او.
عرش و کرسی چه تفاوتی دارند؟|عرش وحدت، عقل، نبوت و نور احدیت؛ کرسی کثرت، نفس، ولایت و نور واحدیت.
سدرةالمنتها کجاست؟|اصلش در کرسی، ظهورش در آسمان هفتم.
حد جبرئیل کجا بود و چه گفت؟|فلک منازل زیر کرسی؛ گفت بند انگشتی پیش روم می‌سوزم.
نزول دوم در سدره چگونه بود؟|دو بار: یک بار در عرش (نبوت) و یک بار در کرسی (ولایت).
ترتیب خلقت فرشتگان؟|میکائیل، اسرافیل، عزرائیل، جبرئیل.
جبرئیل را کجا و چگونه دید؟|در عرفات با صورت اصلی که افق را پر کرده بود.
صورت دحیه چه نقشی دارد؟|عرض بود و دخیل به ذات جبرئیل نبود.
براق چیست؟|ظهور روح؛ از قاطر کوچک‌تر و از الاغ بزرگ‌تر.
غذا چگونه روح حیوانی می‌شود؟|به خون و بخار لطیف تبدیل می‌شود و در دل روح می‌شود.
خلط‌های چهارگانه را بگو.|صفرا، بلغم، خون، سودا؛ صفرا به مراره، سودا به طحال.
نظر نویسنده درباره «بنده خدا می‌شود»؟|باطل و قول اهل ضلال؛ نهایت آیت و صفت خداست.
نمونه‌ی نادانی امت‌ها؟|گوساله‌پرستی بنی‌اسرائیل پس از معجزات موسی.
علی (ع) در معراج کجا دیده شد؟|در سمت چپ؛ جانب نفس و عقل در سمت راست.`;
const sh=d=>{const o=d.slice(1,5),c=o[0];for(let i=3;i>0;i--){const j=Math.random()*(i+1)|0;[o[i],o[j]]=[o[j],o[i]]}return[d[0],...o,o.indexOf(c)]};
const P=s=>s.trim().split("\n").map(l=>l.split("|"));
let sc={},tot={};
const tabs=[["خلاصه"],["چهارگزینه‌ای"],["درست/نادرست"],["جای‌خالی"],["پرسش و پاسخ"]];
const nav=document.getElementById("nav"),v=document.getElementById("v"),scb=document.getElementById("sc");
tabs.forEach((t,i)=>{const b=document.createElement("button");b.textContent=t[0];b.onclick=()=>go(i);nav.append(b)});
function ups(i){scb.style.display=i?"block":"none";const k=sc[i]||0;scb.textContent="امتیاز: "+k+" از ۲۵"}
function el(h,c){const d=document.createElement("div");d.className=c||"card";d.innerHTML=h;return d}
function go(i){[...nav.children].forEach((b,j)=>b.classList.toggle("on",i==j));v.innerHTML="";sc[i]=sc[i]||0;ups(i);
if(i==0){S.forEach((s,n)=>v.append(el(`<h2>${n+1}. ${s[0]}</h2><p>${s[1]}</p>`)));return}
const D=[0,P(M).map(sh),P(T),P(B),P(Q)][i];
D.forEach((d,n)=>{const c=el(`<div class=q>${n+1}. ${i==3?d[0].replace("____","<b>______</b>"):d[0]}</div>`);let done=0;
if(i==1){for(let k=1;k<5;k++){const b=document.createElement("button");b.className="o";b.textContent=d[k];b.onclick=()=>{if(done)return;done=1;const ok=k-1==d[5];b.classList.add(ok?"ok":"no");if(ok)sc[i]++;else c.querySelectorAll(".o")[d[5]].classList.add("ok");ups(i)};c.append(b)}}
else if(i==2){[["درست",1],["نادرست",0]].forEach(([l,val])=>{const b=document.createElement("button");b.className="o";b.textContent=l;b.onclick=()=>{if(done)return;done=1;const ok=val==d[1];b.classList.add(ok?"ok":"no");if(ok)sc[i]++;else c.querySelectorAll(".o")[1-val].classList.add("ok");ups(i)};c.append(b)})}
else{const r=el("<b>پاسخ:</b> "+d[1],"r");const sh=document.createElement("button");sh.className="btn";sh.textContent="نمایش پاسخ";
sh.onclick=()=>{r.classList.add("s");sh.remove();if(i==3||i==4){const y=document.createElement("button"),nn=document.createElement("button");y.className=nn.className="btn";y.textContent="بلد بودم";nn.textContent="بلد نبودم";y.onclick=()=>{if(!done){done=1;sc[i]++;ups(i)}y.remove();nn.remove()};nn.onclick=()=>{done=1;y.remove();nn.remove()};r.append(document.createElement("br"),y,nn)}};c.append(sh,r)}
v.append(c)})}
go(0);
